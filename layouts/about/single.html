{{ define "main" }}
  {{ .Scratch.Set "scope" "single" }}
  <article class="ctf-writeups-page about-page">
    {{ partial "background/collector-dotgrid.html" . }}

    <header class="mt-10 max-w-prose">
      {{ if .Params.showBreadcrumbs | default false }}
        {{ partial "breadcrumbs.html" . }}
      {{ end }}
      <h1 class="mt-0 text-4xl font-extrabold text-neutral-900 dark:text-neutral">
        {{ .Title | emojify }}
      </h1>
    </header>

    <section class="mt-6 prose dark:prose-invert max-w-prose">
      {{ .Content }}
    </section>
  </article>
{{ end }}
